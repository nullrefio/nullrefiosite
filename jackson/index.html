<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locumfy Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .link-card {
            display: block;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .link-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .link-card h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        .link-card p {
            font-size: 0.95em;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .links {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px;
            }

            h1 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Locumfy Documentation</h1>
        <p class="subtitle">Browse our documentation resources</p>

        <div class="links">
            <a href="tech-docs/index.html" class="link-card">
                <h2>📚 Technical Documentation</h2>
                <p>Technical guides and API documentation</p>
            </a>

            <a href="walk-thru/index.html" class="link-card">
                <h2>🚀 Walkthrough</h2>
                <p>Step-by-step guides and tutorials</p>
            </a>
        </div>
    </div>
</body>
</html>
